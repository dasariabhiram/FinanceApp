# Prefer deploying from repo root (see /netlify.toml). Kept in sync for base=apps/web.
[build]
  command = "cd ../.. && pnpm install --frozen-lockfile --prod=false && pnpm build:netlify-api && test -f netlify/functions/api/index.cjs && pnpm --filter @finance/web build"
  publish = "dist"
  functions = "../../netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  COREPACK_INTEGRITY_KEYS = "0"

[functions]
  node_bundler = "esbuild"

[functions."api"]
  node_bundler = "none"

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
