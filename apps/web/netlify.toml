# Prefer deploying from repo root (see /netlify.toml).
[build]
  command = "cd ../.. && pnpm install --frozen-lockfile --prod=false && pnpm --filter @finance/web build"
  publish = "dist"
  functions = "../../netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  COREPACK_INTEGRITY_KEYS = "0"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["postgres"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
