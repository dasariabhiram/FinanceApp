[build]
  command = "test -d netlify/functions && corepack enable && pnpm install --frozen-lockfile && pnpm --filter @finance/web build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Bundle workspace TS packages into the function
  external_node_modules = ["postgres"]

[dev]
  command = "pnpm --filter @finance/web dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# SPA fallback — function path /api/* takes precedence
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
