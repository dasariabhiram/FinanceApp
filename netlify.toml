[build]
  # Force install of devDependencies (tsc/vite). Netlify UI NODE_ENV=production
  # otherwise makes pnpm skip them and `tsc` is not found.
  command = "pnpm install --frozen-lockfile --prod=false && pnpm --filter @finance/web build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  COREPACK_INTEGRITY_KEYS = "0"

[functions]
  node_bundler = "esbuild"
  # Bundle postgres into the function — externalizing it in a pnpm monorepo
  # often yields MODULE_NOT_FOUND at runtime (opaque Netlify 502).

[dev]
  command = "pnpm --filter @finance/web dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# Rewrite /api → function while keeping the remainder of the path.
# Functions 2.0 `config.path` also matches /api/*; this is a safe fallback.
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
