[build]
  # Netlify auto-runs `pnpm install` from pnpm-lock.yaml — only build here
  command = "pnpm --filter @finance/web build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Avoid Corepack signature failures on some Netlify images
  COREPACK_INTEGRITY_KEYS = "0"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["postgres"]

[dev]
  command = "pnpm --filter @finance/web dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# SPA fallback — function path /api/* takes precedence
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
